<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>STANDSTILL</title>
  <meta name="description" content="A first-person action game where time moves only when you move.">
  <style>
    :root { --red: #e8262b; --white: #f7f7f7; --ink: #151515; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f2f2; color: var(--ink); font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    #hud .xh { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
    #hud .ammo { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: center; }
    #hud .ammo i { width: 9px; height: 22px; border: 2px solid var(--ink); background: transparent; }
    #hud .ammo i.on { background: var(--ink); }
    #hud .ammo span { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    #hud .lvl { position: absolute; left: max(18px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); font-size: 15px; letter-spacing: .12em; }
    #hud .flash { position: absolute; inset: 0; opacity: 0; }
    #hud .banner { position: absolute; inset: 0; display: grid; place-items: center; background: var(--red); opacity: 0; transition: opacity .12s; }
    #hud .banner.on { opacity: 1; }
    #hud .banner > b { color: #fff; font-size: clamp(52px, 15vw, 210px); line-height: .9; letter-spacing: -.02em; text-align: center; padding: 0 16px; font-style: italic; }
    #hud .tag { position: absolute; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--red); color: #fff; padding: 8px 14px; font-size: 14px; letter-spacing: .14em; white-space: nowrap; }
    #hud .tag span { opacity: .8; font-size: 12px; }
    #hud .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; pointer-events: auto; cursor: pointer; background: rgba(242,242,242,.82); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    #hud .screen[hidden], #hud [hidden] { display: none !important; }
    #hud .screen.dead { background: rgba(232,38,43,.28); }
    #hud h1 { margin: 0; font-size: clamp(46px, 12vw, 132px); line-height: .9; letter-spacing: -.03em; font-style: italic; color: var(--red); }
    #hud h2 { margin: 0; font-size: clamp(36px, 8vw, 80px); font-style: italic; }
    #hud .sub { margin: 14px 0 22px; font-size: clamp(15px, 2.4vw, 22px); letter-spacing: .06em; }
    #hud ul { list-style: none; margin: 0 0 24px; padding: 0; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.9; }
    #hud ul b { font-family: "Arial Black", Arial, sans-serif; }
    #hud .go { display: inline-block; margin: 18px 0 6px; padding: 12px 22px; background: var(--ink); color: #fff; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
    #hud .small, #hud .stats { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; color: #555; }
    #hud .stats { font-size: 18px; line-height: 1.6; color: var(--ink); margin-top: 18px; }
    #hud .debug { position: absolute; left: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.72); color: #fff; padding: 6px 9px; }
    #touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    #touch .stick { position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: max(28px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%; border: 2px solid rgba(21,21,21,.35); background: rgba(255,255,255,.25); pointer-events: auto; touch-action: none; }
    #touch .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(21,21,21,.55); }
    #touch .btns { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(64px, calc(env(safe-area-inset-bottom) + 50px)); display: grid; grid-template-columns: auto auto; gap: 12px; pointer-events: auto; }
    #touch button { width: 74px; height: 74px; border-radius: 50%; border: 0; background: rgba(21,21,21,.7); color: #fff; font: 13px "Arial Black", Arial, sans-serif; letter-spacing: .06em; touch-action: none; }
    #touch button.fire { grid-row: span 2; width: 92px; height: 92px; align-self: center; background: rgba(232,38,43,.85); }
    #loading, #nowebgl { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: #f2f2f2; font-size: 18px; letter-spacing: .14em; padding: 24px; text-align: center; }
    body.replaying #hud .xh, body.replaying #hud .ammo { display: none; }
    #hud .ammo i.wide { width: 16px; }
    #hud .ammo span { margin-right: 6px; }
    #hud .banner { flex-direction: column; }
    #hud .banner.on { display: flex; align-items: center; justify-content: center; }
    #hud .banner .res { color: #fff; font: 700 clamp(15px, 2.2vw, 22px)/1.5 "Helvetica Neue", Arial, sans-serif; text-align: center; margin-top: 18px; padding: 0 16px; }
    #hud .banner .small { color: rgba(255,255,255,.9); }
    #hud .banner ol.lb { color: #fff; }
    #hud .banner .res .rank { font: italic 900 clamp(28px, 5vw, 54px) "Arial Black", Arial, sans-serif; display: block; }
    #hud .modes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 8px 0 10px; }
    #hud button.go { border: 0; cursor: pointer; font-family: "Arial Black", Arial, sans-serif; }
    #hud button.go.alt { background: var(--red); }
    #hud label.name { display: flex; flex-direction: column; gap: 6px; align-items: center; font: 13px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #555; margin-bottom: 6px; }
    #hud label.name input { font: 20px "Arial Black", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-align: center; width: min(260px, 80vw); padding: 8px 10px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
    #hud ol.lb { list-style: none; counter-reset: n; margin: 8px auto 0; padding: 0; width: min(340px, 86vw); text-align: left; font: 15px/1.7 "Helvetica Neue", Arial, sans-serif; }
    #hud ol.lb li { counter-increment: n; display: flex; gap: 10px; border-bottom: 1px solid rgba(0,0,0,.1); }
    #hud .banner ol.lb li { border-color: rgba(255,255,255,.3); }
    #hud ol.lb li::before { content: counter(n) "."; width: 28px; opacity: .6; }
    #hud ol.lb li span { flex: 1; } #hud ol.lb li.me { font-weight: 700; }
    #loading[hidden], #nowebgl[hidden], #touch[hidden] { display: none; }
    #VRButton { z-index: 4 !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="touch" hidden>
    <div class="stick"><i></i></div>
    <div class="btns"><button class="fire" data-act="fire">FIRE</button><button data-act="throw">THROW</button><button data-act="punch">PUNCH</button></div>
  </div>
  <div id="loading">LOADING…</div>
  <div id="nowebgl" hidden>This game needs WebGL, and this browser or device doesn't have it turned on.</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
